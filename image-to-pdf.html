
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF - SmartKit</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff4e8;color:#51331e}
header{background:#a64b16;color:white;padding:30px 18px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
main{max-width:650px;margin:35px auto;padding:20px}
.card{background:white;border:2px solid #f2d2b6;border-radius:8px;padding:25px}
h2{margin-top:0;color:#a64b16}
input,button{width:100%;padding:14px;margin:12px 0;border-radius:6px;font-size:16px}
input{border:1px solid #d9b99e}
button{background:#a64b16;color:white;border:0;font-weight:bold}
button:active{background:#77350f}
#imagesPdfMessage{font-weight:bold;margin-top:15px}
#imagesPdfDownload{display:block;margin-top:15px;padding:13px;background:#ffead8;color:#77350f;border-radius:6px;text-align:center;text-decoration:none}
.back{display:inline-block;margin-top:20px;color:#a64b16;font-weight:bold;text-decoration:none}
footer{text-align:center;padding:20px;color:#80654e}
</style>
</head>
<body>
<header>
<h1>Image to PDF</h1>
<p>Turn your pictures into one PDF document</p>
</header>
<main>
<div class="card">
<h2>Create PDF from Images</h2>
<p>Select one or more images to combine them into a PDF.</p>
<input type="file" id="imagesToPdf" accept="image/*" multiple>
<button onclick="convertImagesToPDF()">Convert Images to PDF</button>
<p id="imagesPdfMessage"></p>
<a id="imagesPdfDownload" style="display:none;" download="smartkit-images.pdf">Download PDF</a>
</div>
<a class="back" href="index.html">← Back to Home</a>
</main>
<footer>SmartKit — All Your Tools. One Place.</footer>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="script.js"></script>
</body>
</html>
