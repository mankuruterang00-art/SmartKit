
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor - SmartKit</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f8e9;color:#263b20}
header{background:#558b2f;color:white;padding:32px 18px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
main{max-width:620px;margin:40px auto;padding:20px}
.card{background:white;padding:28px;border-radius:24px;box-shadow:0 8px 25px #456b2520}
h2{color:#558b2f;margin-top:0}
input,button{width:100%;padding:14px;margin:12px 0;font-size:16px}
input[type="file"]{border:1px dashed #8caf70;border-radius:12px}
input[type="range"]{accent-color:#558b2f}
button{background:#558b2f;color:white;border:0;border-radius:30px;font-weight:bold}
button:active{background:#3d6820}
#imageInfo{margin-top:15px;line-height:1.6}
#downloadImage{display:block;text-align:center;padding:13px;background:#e4f2d6;color:#365d20;border-radius:12px;text-decoration:none;margin-top:15px}
.back{display:inline-block;margin-top:22px;color:#558b2f;font-weight:bold;text-decoration:none}
footer{text-align:center;padding:20px;color:#66775c}
</style>
</head>
<body>
<header>
<h1>Image Compressor</h1>
<p>Reduce image file size easily</p>
</header>
<main>
<div class="card">
<h2>Compress Your Image</h2>
<p>Choose an image and adjust the quality.</p>
<input type="file" id="imageInput" accept="image/*">
<label for="imageQuality">Image Quality</label>
<input type="range" id="imageQuality" min="0.1" max="1" step="0.1" value="0.7">
<button onclick="compressImage()">Compress Image</button>
<div id="imageInfo"></div>
<a id="downloadImage" style="display:none;" download="smartkit-compressed.jpg">Download Compressed Image</a>
</div>
<a class="back" href="index.html">← Back to Home</a>
</main>
<footer>SmartKit — All Your Tools. One Place.</footer>
<script src="script.js"></script>
</body>
</html>
