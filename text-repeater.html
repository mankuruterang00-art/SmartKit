
<!DOCTYPE html>
<html lang="en">
<head>
  
<link rel="icon" type="image/svg+xml" href="favicon.svg">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Repeater - SmartKit</title>
<style>
body{margin:0;font-family:Arial;background:#f7edff;color:#40235b}
header{background:#7839a6;color:white;text-align:center;padding:30px}
main{max-width:650px;margin:35px auto;padding:20px}
.card{background:white;padding:25px;border-radius:20px;box-shadow:0 6px 22px #7839a620}
textarea,input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #d6c2e6;border-radius:8px;font-size:16px;margin:10px 0}
textarea{height:110px}
button{width:100%;padding:14px;background:#7839a6;color:white;border:0;border-radius:8px;font-weight:bold;margin-top:10px}
#repeatResult{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3e8fc;padding:15px;margin-top:15px;max-height:300px;overflow:auto}
.back{display:inline-block;margin-top:20px;color:#7839a6;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<header><h1>Text Repeater</h1><p>Repeat your text as many times as you want</p></header>
<main><div class="card">
<h2>Enter Your Text</h2>
<textarea id="repeatText" placeholder="Type your text here..."></textarea>
<label for="repeatCount">Number of repetitions</label>
<input type="number" id="repeatCount" min="1" max="1000" value="5">
<button onclick="makeRepeat()">Repeat Text</button>
<div id="repeatMessage"></div>
<div id="repeatResult"></div>
<button onclick="copyRepeatedText()">Copy Repeated Text</button>
</div><a class="back" href="index.html">← Back to Home</a></main>
<script>
function makeRepeat(){
const text=document.getElementById("repeatText").value;
const count=parseInt(document.getElementById("repeatCount").value);
const message=document.getElementById("repeatMessage");
const result=document.getElementById("repeatResult");
if(!text.trim()||!Number.isInteger(count)||count<1||count>1000){
message.textContent="Enter text and a number from 1 to 1000.";
result.textContent="";
return;
}
const repeated=Array(count).fill(text).join("\n");
result.textContent=repeated;
message.textContent="Text repeated "+count+" times.";
}
function copyRepeatedText(){
const text=document.getElementById("repeatResult").textContent;
if(!text){alert("Please repeat some text first.");return;}
navigator.clipboard.writeText(text).then(()=>alert("Copied!")).catch(()=>alert("Copy is not available in this browser."));
}
</script>
</body>
</html>
