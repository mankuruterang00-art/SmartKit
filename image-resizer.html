
<!DOCTYPE html>
<html lang="en">
<head>
  
<link rel="icon" type="image/svg+xml" href="favicon.svg">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Resizer - SmartKit</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f0ff;color:#25254a}
header{background:#4545a8;color:white;padding:32px 18px;text-align:center}
header h1{margin:0;font-size:29px}
header p{margin:9px 0 0}
main{max-width:620px;margin:40px auto;padding:20px}
.card{background:white;padding:28px;border-radius:12px;border:1px solid #d5d5f5;box-shadow:0 8px 24px #4545a820}
h2{color:#4545a8;margin-top:0}
input,button{width:100%;padding:14px;margin:10px 0;font-size:16px;border-radius:8px}
input{border:1px solid #c8c8e8}
button{background:#4545a8;color:white;border:0;font-weight:bold}
button:active{background:#303078}
.back{display:inline-block;margin-top:22px;color:#4545a8;font-weight:bold;text-decoration:none}
#resizeInfo{margin-top:15px;line-height:1.6}
#resizeDownload{display:block;margin-top:15px;padding:13px;background:#e8e8ff;color:#303078;text-align:center;text-decoration:none;border-radius:8px}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>Image Resizer</h1>
<p>Resize your images to your preferred dimensions</p>
</header>
<main>
<div class="card">
<h2>Resize Your Image</h2>
<p>Select an image and enter the new dimensions in pixels.</p>
<input type="file" id="resizeInput" accept="image/*">
<label for="resizeWidth">Width (pixels)</label>
<input type="number" id="resizeWidth" placeholder="Enter width">
<label for="resizeHeight">Height (pixels)</label>
<input type="number" id="resizeHeight" placeholder="Enter height">
<button onclick="resizeImage()">Resize Image</button>
<div id="resizeInfo"></div>
<a id="resizeDownload" style="display:none;" download="smartkit-resized.png">Download Resized Image</a>
</div>
<a class="back" href="index.html">← Back to Home</a>
</main>
<footer>SmartKit — All Your Tools. One Place.</footer>
<script src="script.js"></script>
</body>
</html>
