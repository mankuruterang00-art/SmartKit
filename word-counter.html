
<!DOCTYPE html>
<html lang="en">
<head>
  
<link rel="icon" type="image/svg+xml" href="favicon.svg">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter - SmartKit</title>
<style>
body{margin:0;font-family:Arial;background:#eef8ff;color:#183b59}
header{background:#176b9b;color:white;text-align:center;padding:30px}
main{max-width:650px;margin:35px auto;padding:20px}
.card{background:white;padding:25px;border-radius:15px}
textarea{width:100%;height:190px;padding:12px;box-sizing:border-box;border:1px solid #b7d5e8;border-radius:8px;font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.stat{background:#e4f3fc;padding:15px;border-radius:8px;text-align:center}
.stat strong{display:block;font-size:25px;color:#176b9b}
.back{display:inline-block;margin-top:20px;color:#176b9b;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<header><h1>Word Counter</h1><p>Count words and characters instantly</p></header>
<main><div class="card">
<h2>Enter Your Text</h2>
<textarea id="wordText" placeholder="Start typing here..." oninput="countText()"></textarea>
<div class="stats">
<div class="stat">Words<strong id="wordCount">0</strong></div>
<div class="stat">Characters<strong id="charCount">0</strong></div>
<div class="stat">Sentences<strong id="sentenceCount">0</strong></div>
<div class="stat">Paragraphs<strong id="paragraphCount">0</strong></div>
</div>
</div><a class="back" href="index.html">← Back to Home</a></main>
<script>
function countText(){
const text=document.getElementById("wordText").value;
const words=text.trim()?text.trim().split(/\s+/).length:0;
const sentences=(text.match(/[.!?]+(?=\s|$)/g)||[]).length;
const paragraphs=text.trim()?text.trim().split(/\n\s*\n/).filter(p=>p.trim()).length:0;
document.getElementById("wordCount").textContent=words;
document.getElementById("charCount").textContent=text.replace(/\s/g,"").length;
document.getElementById("sentenceCount").textContent=sentences;
document.getElementById("paragraphCount").textContent=paragraphs;
}
</script>
</body>
</html>
